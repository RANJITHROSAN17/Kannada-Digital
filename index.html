<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kannada Saathi — Speak Kannada with confidence</title>
    <meta
      name="description"
      content="Kannada Saathi helps non-Kannada speakers communicate in real life across Karnataka: situation-based phrases, transliteration, pronunciation playback, role-play conversations and quizzes."
    />
    <meta name="theme-color" content="#131B31" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kannada Saathi" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!--
      Zero external requests: Inter and Noto Sans Kannada are bundled in
      src/assets/ and referenced from src/index.css, so Kannada renders on a
      machine with no system Kannada font and with no internet connection.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:36rem;margin:3rem auto;padding:1.5rem;font-family:system-ui,sans-serif;line-height:1.6">
        <h1>Kannada Saathi needs JavaScript</h1>
        <p>Enable JavaScript and reload. The app has no server component — all
        content is bundled in the page you just downloaded.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
