<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kannada Saathi — Speak Kannada with confidence</title>
    <meta
      name="description"
      content="Kannada Saathi helps non-Kannada speakers communicate in real life across Karnataka: situation-based phrases, transliteration, pronunciation playback, role-play conversations and quizzes."
    />
    <meta name="theme-color" content="#131B31" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Webfonts are progressive enhancement only: the CSS always falls back to
      system Kannada fonts (Nirmala UI / Tunga / Kannada MN), so the app is
      fully readable offline or if fonts.googleapis.com is blocked.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >Kannada Saathi needs JavaScript enabled. Please enable it and reload, or see the README for the
      static preview.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
