# Desktop app build — produces a Windows .exe with offline Whisper recognition
# and espeak-ng Kannada TTS bundled. The exe is published to GitHub Releases.

name: Desktop Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install web deps
        run: npm ci

      - name: Install desktop deps
        run: cd desktop && npm ci

      - name: Create desktop/bin directory
        run: mkdir -p desktop/bin

      - name: Build whisper.cpp
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git "$env:TEMP\whisper.cpp"
          cd "$env:TEMP\whisper.cpp"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j4
          Copy-Item build\bin\whisper-cli.exe "$env:GITHUB_WORKSPACE\desktop\bin\whisper-cli.exe" -Force

      - name: Download Whisper small model
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin" -OutFile "desktop\bin\ggml-small.bin"

      - name: Build espeak-ng
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/espeak-ng/espeak-ng.git "$env:TEMP\espeak-ng"
          cd "$env:TEMP\espeak-ng"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          Copy-Item build\src\espeak-ng.exe "$env:GITHUB_WORKSPACE\desktop\bin\espeak-ng.exe" -Force
          Copy-Item build\espeak-ng-data "$env:GITHUB_WORKSPACE\desktop\bin\espeak-ng-data" -Recurse -Force

      - name: Build web app
        run: npm run build

      - name: Build desktop app
        shell: pwsh
        run: |
          cd desktop
          npx electron-builder --win --x64

      - name: Upload exe to Releases
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.exe
          body: |
            Kannada Saathi Desktop v$GITHUB_REF_NAME

            Offline speech recognition (Whisper small) + offline Kannada TTS (espeak-ng).
            No API key, no network required for voice. Translation uses the keyless
            Google/MyMemory chain when online.
          name: Kannada Saathi Desktop v$GITHUB_REF_NAME
