name: Propose a New Lint / Security Rule
description: Suggest a new MCP diagnostic rule, framework parser, or output reporter
title: "feat(rules): "
labels: ["type/feature", "help wanted"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Rule Category
      options:
        - security
        - tokens
        - schema
        - contract
        - parser / reporter
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem & Real-World Failure Mode
      description: What bug, security sink, or LLM failure mode does this rule prevent?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Bad vs Good Example
      description: Show an example that SHOULD trigger the diagnostic and one that SHOULD pass cleanly.
    validations:
      required: true
