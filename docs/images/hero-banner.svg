<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Kannada Saathi: 111 phrases, 8 situations, 6 role-plays, 290 audio clips, 83 tests, 0 vulnerabilities">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1630"/>
      <stop offset="55%" stop-color="#16234a"/>
      <stop offset="100%" stop-color="#22355f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5a524"/>
      <stop offset="100%" stop-color="#ffcc66"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="300" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

    <!-- decorative geometry, intentionally script-agnostic so it renders everywhere -->
    <circle cx="1085" cy="36" r="120" fill="#ffffff" opacity="0.030"/>
    <circle cx="1160" cy="150" r="78" fill="#f5a524" opacity="0.065"/>
    <circle cx="1010" cy="178" r="46" fill="#ffffff" opacity="0.035"/>
    <path d="M0 196 H1200" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

    <!-- accent bar -->
    <rect x="56" y="46" width="6" height="106" rx="3" fill="url(#accent)"/>

    <!-- hero copy -->
    <text x="82" y="70" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"
          font-size="13" font-weight="700" letter-spacing="2.2" fill="#f5b942">
      KANNADA DIGITAL INNOVATION HACKATHON 2026
    </text>
    <text x="80" y="122" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"
          font-size="46" font-weight="700" fill="#ffffff">Kannada Saathi</text>
    <text x="82" y="155" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"
          font-size="20" fill="#b9c8e8">Speak Kannada. Navigate Karnataka with confidence.</text>

    <!-- problem statement chip (top right, clear of the kicker) -->
    <rect x="930" y="46" width="226" height="34" rx="17" fill="#f5a524" opacity="0.16"/>
    <rect x="930" y="46" width="226" height="34" rx="17" fill="none" stroke="#f5a524" stroke-opacity="0.55"/>
    <text x="1043" y="68" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"
          font-size="12.5" font-weight="700" letter-spacing="0.8" fill="#ffd27a">PROBLEM STATEMENT #3</text>

    <!-- stats ribbon -->
    <g font-family="DejaVu Sans, Arial, Helvetica, sans-serif" text-anchor="middle">
      <text x="100" y="251" font-size="34" font-weight="700" fill="#ffc861">111</text>
      <text x="100" y="277" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9fb2d9">PHRASES</text>

      <text x="300" y="251" font-size="34" font-weight="700" fill="#ffc861">8</text>
      <text x="300" y="277" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9fb2d9">SITUATIONS</text>

      <text x="500" y="251" font-size="34" font-weight="700" fill="#ffc861">6</text>
      <text x="500" y="277" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9fb2d9">ROLE-PLAYS</text>

      <text x="700" y="251" font-size="34" font-weight="700" fill="#ffc861">290</text>
      <text x="700" y="277" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9fb2d9">AUDIO CLIPS</text>

      <text x="900" y="251" font-size="34" font-weight="700" fill="#ffc861">83</text>
      <text x="900" y="277" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9fb2d9">TESTS PASSING</text>

      <text x="1100" y="251" font-size="34" font-weight="700" fill="#ffc861">0</text>
      <text x="1100" y="277" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9fb2d9">VULNERABILITIES</text>
    </g>

    <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
      <path d="M200 216 V286"/>
      <path d="M400 216 V286"/>
      <path d="M600 216 V286"/>
      <path d="M800 216 V286"/>
      <path d="M1000 216 V286"/>
    </g>
  </g>
</svg>
